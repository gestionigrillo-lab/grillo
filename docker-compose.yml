version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d securevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://vault:vault@postgres:5432/securevault?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-changeme-admin-token}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Assistente Condominiale Ufficio ---
  assistente-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistente_condominiale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - assistente_pgdata:/var/lib/postgresql/data
      - ./assistente-condominiale/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistente_condominiale"]
      interval: 5s
      timeout: 5s
      retries: 5

  assistente-api:
    build:
      context: ./assistente-condominiale
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@assistente-db:5432/assistente_condominiale"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-sonnet-4-20250514}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      ESCALATION_PHONE: "${ESCALATION_PHONE:-}"
      ESCALATION_EMAIL: "${ESCALATION_EMAIL:-admin@gestionigrillo.it}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      APP_DEBUG: "true"
    depends_on:
      assistente-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  assistente_pgdata:
